name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Score skill-forge itself
        run: python scripts/skillforge.py score . --min-score 85

      - name: Score the bundled example
        run: python scripts/skillforge.py score examples/photos-by-date --min-score 85

      - name: JSON output is valid
        run: python scripts/skillforge.py score . --json | python -c "import json,sys; json.load(sys.stdin)"
